# nginx serves the compiled Angular app AND forwards API calls to the Spring Boot container.
# Because the browser talks to a single origin (this nginx), no CORS configuration is needed.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward REST API and Swagger docs to the backend service (name from docker-compose.yml).
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown paths such as /applications/5/edit are Angular routes, not files,
    # so return index.html and let the Angular router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

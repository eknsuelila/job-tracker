# Runs the whole stack with one command:  docker compose up --build
# Then open http://localhost:8091 (demo login: demo@example.com / password123)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    volumes:
      - db-data:/var/lib/postgresql/data      # keeps data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/jobtracker
      DB_USERNAME: jobtracker
      DB_PASSWORD: jobtracker
      JWT_SECRET: ${JWT_SECRET:-Y2hhbmdlLW1lLXRoaXMtaXMtYS1kb2NrZXItZGVtby1zZWNyZXQtMTIzNDU2Nzg5MA==}
    depends_on:
      db:
        condition: service_healthy            # wait until Postgres accepts connections

  frontend:
    build: ./frontend
    ports:
      - "8091:80"
    depends_on:
      - backend

volumes:
  db-data:
